[build]
  publish = "."

# Netlify Forms posts to /thank-you; serve the static confirmation page there.
[[redirects]]
  from = "/thank-you"
  to = "/thank-you.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# v2 preview: its form posts to /v2/thank-you.
[[redirects]]
  from = "/v2/thank-you"
  to = "/v2/thank-you.html"
  status = 200
